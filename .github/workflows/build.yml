name: Build and Minimize ApkGolf

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zip

      # Step 1: Pack the data file into the root of the ZIP
      - name: Assemble Unsigned Container
        run: |
          cp app/AndroidManifest.xml ./AndroidManifest.xml
          zip -9 unsigned.apk AndroidManifest.xml

      # Step 2: Use the exact override flag to bypass manifest validation errors
      - name: Apply Stripped Cryptographic Signature
        run: |
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # Adding --min-sdk-version 26 strictly forces apksigner to stop parsing the manifest
          $REAL_SIGNER sign \
            --min-sdk-version 26 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --key key.pk8 \
            --cert key.x509.pem \
            --out signed-release.apk \
            unsigned.apk

      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
