name: Build and Minimize ApkGolf

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zopfli zip

      # STEP 1: Manually zip the pre-compiled binary manifest using zopfli
      # This mirrors exactly how the original repository bundles the 678 byte archive
      - name: Compress Unsigned APK with Zopfli
        run: |
          # Create a working copy of the pre-compiled binary manifest
          cp app/AndroidManifest.xml ./AndroidManifest.xml
          
          # Compress the file cleanly using high-compression zopfli
          zopfli --zip AndroidManifest.xml
          
          # Rename the optimized archive container to a raw unsigned build layout
          mv AndroidManifest.xml.zip unsigned.apk

      # STEP 2: Manually sign with the minimalist key, forcing signature downgrades
      - name: Stripped Execution Signing
        run: |
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # Force drop modern metadata bloat (v1, v3, v4) to strictly isolate the hand-crafted v2 block
          $REAL_SIGNER sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --key key.pk8 \
            --cert key.x509.pem \
            --out signed-release.apk \
            unsigned.apk

      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
