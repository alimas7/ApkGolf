name: Build and Minimize ApkGolf

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zopfli

      # STEP 1: Generate the unsigned app package using the correct manifest path
      - name: Compile Unsigned APK Block
        run: |
          REAL_AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          
          # Fixed path to point directly to app/AndroidManifest.xml
          $REAL_AAPT package -f -M app/AndroidManifest.xml -F unsigned.apk

      # STEP 2: Manually sign with the minimalist key, forcing signature downgrades
      - name: Stripped Execution Signing
        run: |
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # Force drop modern metadata bloat (v1, v3, v4) to strictly isolate the hand-crafted v2 block
          $REAL_SIGNER sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --key key.pk8 \
            --cert key.x509.pem \
            --out signed-release.apk \
            unsigned.apk

      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
