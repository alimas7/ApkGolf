name: Build and Minimize ApkGolf

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zip

      # Mirroring the project's exact file arrangement and compression sequence
      - name: Replicate True Build Pipeline
        run: |
          # 1. Recreate the precise workspace subdirectories
          mkdir -p build/apk
          cp app/AndroidManifest.xml build/apk/
          
          # 2. Package using the exact -j -r flags to strip out filesystem attribute bloat
          zip -j -r build/app-unsigned.apk build/apk
          
          # 3. Locate the runner's real SDK path dynamically
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # 4. Sign using the identical configuration strings and target min-sdk-version 24
          $REAL_SIGNER sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --key key.pk8 \
            --cert key.x509.pem \
            --in build/app-unsigned.apk \
            --out build/signed-release.apk \
            --min-sdk-version 24
            
          # 5. Bring the finished output to the root directory
          cp build/signed-release.apk signed-release.apk

      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
