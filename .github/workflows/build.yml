name: Build and Minimize ApkGolf

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Set up the correct JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 2: Install absolute minimal dependencies
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zip

      # Step 3: Package the pre-compiled binary manifest into a clean ZIP container
      - name: Assemble Unsigned Container
        run: |
          # Copy the pre-compiled manifest into the working directory root
          cp app/AndroidManifest.xml ./AndroidManifest.xml
          
          # Create a completely clean zip file containing only the manifest
          zip -9 unsigned.apk AndroidManifest.xml

      # Step 4: Sign with the minimalistic keys and aggressively strip modern bloat
      - name: Apply Stripped Cryptographic Signature
        run: |
          # Dynamically capture the runner's built-in apksigner tool
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          # Force drop modern metadata bloat blocks (v1, v3, v4) to isolate the tiny custom v2 footprint
          $REAL_SIGNER sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --key key.pk8 \
            --cert key.x509.pem \
            --out signed-release.apk \
            unsigned.apk

      # Step 5: Save the minimal APK file output
      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
