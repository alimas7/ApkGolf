name: Build and Minimize ApkGolf

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environments
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: |
            8
            17

      - name: Install Legacy 26.0.2 Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          JAVA_HOME=$JAVA_HOME_17_X64 $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;26.0.2"

      - name: Assemble Unsigned Container
        run: |
          mkdir -p build/apk
          cp app/AndroidManifest.xml build/apk/
          zip -j -r build/app-unsigned.apk build/apk

      - name: Apply Legacy Cryptographic Signature
        run: |
          export JAVA_HOME=$JAVA_HOME_8_X64
          $ANDROID_HOME/build-tools/26.0.2/apksigner sign \
            --v2-signing-enabled true \
            --key key.pk8 \
            --cert key.x509.pem \
            --in build/app-unsigned.apk \
            --out build/signed-release.apk

      - name: Upload Smallest APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smallest-apk-golf
          path: signed-release.apk
          if-no-files-found: error
