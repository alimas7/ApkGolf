name: Build Valid Micro APK with Dex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zip

      # Step 1: Generate a clean text-based manifest
      - name: Generate Clean Android Manifest
        run: |
          cat << 'EOF' > AndroidManifest.xml
          <manifest xmlns:android="http://android.com" package="com.payload.trigger">
              <application />
          </manifest>
          EOF

      # Step 2: Assemble a minimal, valid raw source file
      - name: Create Dummy Source File
        run: |
          mkdir -p src/com/payload/trigger
          cat << 'EOF' > src/com/payload/trigger/Stub.java
          package com.payload.trigger;
          public class Stub {}
          EOF

      # Step 3: Compile Java to standard classes and convert to Android Dex bytes
      - name: Compile and Build Classes.dex
        run: |
          javac -source 1.8 -target 1.8 src/com/payload/trigger/Stub.java -d .
          
          # Find the SDK's built-in dx or d8 converter utility
          REAL_D8=$(find $ANDROID_HOME/build-tools -name "d8" -o -name "dx" | sort -V | tail -n 1)
          $REAL_D8 com/payload/trigger/Stub.class --output .

      # Step 4: Bundle the structural binary container via AAPT
      - name: Compile Unsigned APK via AAPT
        run: |
          REAL_AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          $REAL_AAPT package -f -M AndroidManifest.xml -F clean-unsigned.apk

      # Step 5: Append the mandatory classes.dex file straight into the asset package
      - name: Inject Dex Block Into APK
        run: |
          zip -g clean-unsigned.apk classes.dex

      # Step 6: Set up standard cryptographic signature keys
      - name: Generate Temporary Keystore Certificate
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass androidpass \
            -alias androiddebugkey \
            -keypass androidpass \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Step 7: Finalize signed container
      - name: Apply Structural Cryptographic Signature
        run: |
          REAL_SIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          $REAL_SIGNER sign \
            --ks debug.keystore \
            --ks-pass pass:androidpass \
            --out clean-trigger.apk \
            clean-unsigned.apk

      - name: Upload Valid Micro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-trigger-apk
          path: clean-trigger.apk
          if-no-files-found: error
